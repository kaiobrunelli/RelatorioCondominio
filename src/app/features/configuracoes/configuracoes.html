<app-page-header title="Configurações" subtitle="Dados do condomínio e regras de rateio"></app-page-header>

<form (ngSubmit)="salvar()" class="space-y-6">
  <app-card title="Dados do condomínio" subtitle="Usados no cabeçalho e nos relatórios" [hasIcon]="true">
    <span icon>
      <svg lucideBuilding2 class="h-4 w-4"></svg>
    </span>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label class="mb-1 block text-xs font-semibold text-ink-soft">Nome do condomínio</label>
        <input
          type="text"
          [(ngModel)]="formulario.nomeCondominio"
          name="nomeCondominio"
          required
          class="w-full rounded-lg border border-primary-100 px-3 py-2 text-sm outline-none focus:border-primary-400"
        />
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-ink-soft">Endereço (opcional)</label>
        <input
          type="text"
          [(ngModel)]="formulario.endereco"
          name="endereco"
          class="w-full rounded-lg border border-primary-100 px-3 py-2 text-sm outline-none focus:border-primary-400"
        />
      </div>
    </div>
  </app-card>

  <app-card
    title="Rateio diferenciado de água"
    subtitle="Unidades tipo cobertura podem pagar um valor extra na cota de água"
    [hasIcon]="true"
  >
    <span icon>
      <svg lucideDroplets class="h-4 w-4"></svg>
    </span>

    <label class="mb-4 flex items-center gap-2 text-sm text-ink">
      <input
        type="checkbox"
        [(ngModel)]="formulario.regraCoberturaAtiva"
        name="regraCoberturaAtiva"
        class="h-4 w-4 rounded border-primary-200 text-primary-600"
      />
      Aplicar acréscimo para unidades cobertura nas categorias marcadas como "rateio diferenciado"
    </label>

    @if (formulario.regraCoberturaAtiva) {
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1 block text-xs font-semibold text-ink-soft">Tipo de acréscimo</label>
          <select
            [(ngModel)]="formulario.tipoAcrescimo"
            name="tipoAcrescimo"
            class="w-full rounded-lg border border-primary-100 px-3 py-2 text-sm outline-none focus:border-primary-400"
          >
            <option value="fixo">Valor fixo em R$ a mais</option>
            <option value="percentual">Percentual a mais sobre a cota normal</option>
          </select>
        </div>
        <div>
          <label class="mb-1 block text-xs font-semibold text-ink-soft">
            {{ formulario.tipoAcrescimo === 'fixo' ? 'Valor extra (R$)' : 'Percentual extra (%)' }}
          </label>
          <input
            type="number"
            min="0"
            step="0.01"
            [(ngModel)]="formulario.valorAcrescimo"
            name="valorAcrescimo"
            class="w-full rounded-lg border border-primary-100 px-3 py-2 text-sm outline-none focus:border-primary-400"
          />
        </div>
      </div>
      <p class="mt-3 text-xs text-ink-soft">
        Exemplo: com acréscimo fixo, se a cota normal de água seria R$ 80,00 e o acréscimo for R$ 15,00, cada
        unidade cobertura pagará R$ 95,00 e as demais unidades dividem o restante da conta entre si.
      </p>
    }
  </app-card>

  <div class="flex items-center gap-3">
    <button type="submit" class="rounded-lg bg-primary-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-primary-700">
      Salvar alterações
    </button>
    @if (salvo()) {
      <span class="flex items-center gap-1.5 text-sm font-semibold text-accent-green">
        <svg lucideCheck class="h-4 w-4"></svg>
        Configurações salvas
      </span>
    }
  </div>
</form>
