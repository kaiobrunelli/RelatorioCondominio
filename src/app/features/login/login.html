<div class="flex min-h-screen items-center justify-center bg-surface px-4">
  <div class="w-full max-w-sm rounded-2xl border border-primary-100 bg-white p-8 shadow-sm">
    <div class="mb-6 flex flex-col items-center text-center">
      <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-primary-100 text-primary-600">
        <svg lucideBuilding2 class="h-6 w-6"></svg>
      </div>
      <h1 class="text-lg font-bold text-ink">Residencial Catalunha</h1>
      <p class="text-sm text-ink-soft">Entre para acessar a gestão do condomínio</p>
    </div>

    <form class="space-y-4" (ngSubmit)="entrar()">
      <div>
        <label class="mb-1 block text-sm font-semibold text-ink" for="login">Login</label>
        <input
          id="login"
          name="login"
          type="text"
          autocomplete="username"
          [(ngModel)]="login"
          class="w-full rounded-xl border border-primary-100 bg-surface px-3 py-2.5 text-sm text-ink outline-none focus:border-primary-400 focus:ring-2 focus:ring-primary-100"
          required
        />
      </div>

      <div>
        <label class="mb-1 block text-sm font-semibold text-ink" for="senha">Senha</label>
        <input
          id="senha"
          name="senha"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="senha"
          class="w-full rounded-xl border border-primary-100 bg-surface px-3 py-2.5 text-sm text-ink outline-none focus:border-primary-400 focus:ring-2 focus:ring-primary-100"
          required
        />
      </div>

      @if (erro()) {
        <p class="rounded-lg bg-accent-red-bg px-3 py-2 text-sm text-accent-red">{{ erro() }}</p>
      }

      <button
        type="submit"
        [disabled]="carregando()"
        class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary-600 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-primary-700 disabled:opacity-60"
      >
        @if (carregando()) {
          <svg lucideLoaderCircle class="h-4 w-4 animate-spin"></svg>
        }
        Entrar
      </button>
    </form>
  </div>
</div>
